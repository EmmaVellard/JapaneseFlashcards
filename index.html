<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JLPT Flashcards</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎴</text></svg>">
  <link rel="stylesheet" href="style.css?v=13" />
</head>
<body>
  <header>
    <h1>JLPT Flashcards</h1>
    <p class="tagline">Kanji and vocabulary practice for JLPT N5, N4, or both</p>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html" aria-current="page">Practice</a>
      <a href="kanji.html">Kanji list</a>
      <a href="vocabulary.html">Vocabulary list</a>
    </nav>
  </header>

  <main class="practice-page">
    <section class="study-panel" aria-label="Study controls">
      <div class="top-controls">
        <label class="study-picker" for="study-type-select">
          Study
          <select id="study-type-select">
            <option value="kanji">Kanji</option>
            <option value="vocabulary">Vocabulary</option>
          </select>
        </label>
        <label class="level-picker" for="level-select">
          Level
          <select id="level-select">
            <option value="N5">JLPT N5</option>
            <option value="N4">JLPT N4</option>
            <option value="ALL">JLPT N5 + N4</option>
          </select>
        </label>
        <button id="toggle-mode" class="mode-toggle">Switch to Multiple Choice</button>
      </div>
      <div class="session-strip" aria-label="Session summary">
        <span id="session-summary">0 cards • 0 studied • 0 remaining</span>
        <span id="question-type-chip" class="question-chip">Flashcard</span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <span id="session-progress-bar"></span>
      </div>
      <details class="session-details">
        <summary>Session details</summary>
        <div class="session-metrics">
          <div class="counters">
            <span id="correct-count">Correct: 0</span>
            <span id="wrong-count">Wrong: 0</span>
            <span id="remaining-count">Remaining: 0</span>
            <span id="success-rate" class="success">Success: 0%</span>
          </div>
          <div class="study-progress">
            <span id="saved-progress">Saved: 0/0 seen</span>
            <button id="reset-progress" type="button">Reset saved progress</button>
          </div>
        </div>
      </details>
    </section>

    <div class="flashcard">
      <div class="card-left" id="kanji-display"></div>
      <div class="card-right" id="answer-display"></div>
      <div class="overlay" id="overlay" data-label="?"></div>
    </div>

    <div class="controls">
      <button id="show-answer">Show Answer</button>
      <button id="right" class="hidden">Correct</button>
      <button id="wrong" class="hidden">Wrong</button>
    </div>

    <div id="choices" class="hidden"></div>

    <details id="wrong-section">
      <summary id="wrong-title">Review Wrong Cards</summary>
      <div id="wrong-cards"></div>
    </details>
  </main>

  <script src="Lists/kanjiN5.js?v=4"></script>
  <script src="Lists/kanjiN4.js?v=4"></script>
  <script src="Lists/vocabN5.js?v=4"></script>
  <script src="Lists/vocabN4.js?v=4"></script>
  <script src="study-utils.js?v=1"></script>
  <script src="progress-store.js?v=2"></script>
  <script src="script.js?v=13"></script>
</body>
</html>
